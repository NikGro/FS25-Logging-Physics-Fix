name: Release

# Creates a GitHub release with the mod ZIP
#  - when a tag v* is pushed (release for exactly that tag), or
#  - on a push to main when the <version> in modDesc.xml has no release yet (tag v<version>).
# Can also be started by hand (Actions > Release > Run workflow).

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MOD_DIR: FS25_ForestryPhysicsExperimental
      ZIP_NAME: FS25_ForestryPhysicsExperimental.zip
      ZIP_CONTENT: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            VER=$(grep -oP '<version>\K[0-9.]+(?=</version>)' "$MOD_DIR/modDesc.xml" | head -1)
            TAG="v$VER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG exists, nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ZIP
        if: steps.tag.outputs.needed == 'true'
        run: |
          cd "$MOD_DIR"
          zip -r -X "$GITHUB_WORKSPACE/$ZIP_NAME" $ZIP_CONTENT -x '.*' -x '*/.*'

      - name: Create release
        if: steps.tag.outputs.needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
